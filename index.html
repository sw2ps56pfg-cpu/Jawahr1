/* Layout: one calm column. The cave-mouth arch is the only bold shape: it frames the logo, the form badges and every question number. */
:root {
  --bg: #EDF1EF;
  --surface: #F8FAF9;
  --ink: #0E2A2D;
  --muted: #4F6567;
  --line: #CAD6D3;
  --accent: #0B5D63;
  --on-accent: #F2FAF9;
  --lamp: #B7791A;
  --lamp-soft: #F4E8CC;
  --ok: #17724A;
  --ok-bg: #DCF0E5;
  --bad: #A93430;
  --bad-bg: #F6DEDC;
  --scrim: rgba(8, 28, 31, .55);
  --f-display: 'YearHandicrafts', 'Segoe UI', Tahoma, sans-serif;
  --f-body: 'YearHandicrafts', 'Segoe UI', Tahoma, sans-serif;
  --f-quran: 'YearHandicrafts', 'Amiri Quran', 'Traditional Arabic', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1719; --surface: #102428; --ink: #E4EFED; --muted: #94AFAC; --line: #1F3D3D;
    --accent: #5CC0C1; --on-accent: #05201F; --lamp: #E0AE55; --lamp-soft: #382D14;
    --ok: #52C88F; --ok-bg: #123828; --bad: #F2817A; --bad-bg: #3B1C1C; --scrim: rgba(0, 0, 0, .68);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1719; --surface: #102428; --ink: #E4EFED; --muted: #94AFAC; --line: #1F3D3D;
  --accent: #5CC0C1; --on-accent: #05201F; --lamp: #E0AE55; --lamp-soft: #382D14;
  --ok: #52C88F; --ok-bg: #123828; --bad: #F2817A; --bad-bg: #3B1C1C; --scrim: rgba(0, 0, 0, .68);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { direction: rtl; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.7 var(--f-body);
  direction: rtl;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding-block: 22px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- home ---------- */
.hero { display: flex; align-items: center; gap: 18px; padding-block: 8px 22px; }
.emblem { flex: none; width: 76px; height: auto; }
.emblem path { fill: none; stroke-width: 3.5; stroke-linecap: round; }
.emblem .o { stroke: var(--accent); }
.emblem .m { stroke: var(--accent); opacity: .55; }
.emblem .i { stroke: var(--accent); opacity: .3; }
.emblem circle { fill: var(--lamp); }
.hero h1 {
  margin: 0;
  font: 700 clamp(1.7rem, 6.2vw, 2.5rem)/1.25 var(--f-display);
  text-wrap: balance;
}
.hero p { margin: 6px 0 0; color: var(--muted); font-size: .95rem; max-width: 46ch; }

.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0 0 26px; padding: 14px 0; border-block: 1px solid var(--line); }
.stats div { display: flex; align-items: baseline; gap: 7px; }
.stats b { font: 700 1.55rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stats span { color: var(--muted); font-size: .92rem; }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
.sec-head h2 { margin: 0; font: 700 1.2rem/1.4 var(--f-display); }
.sec-head span { color: var(--muted); font-size: .88rem; }

.forms { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
.fcard {
  display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; align-items: center; gap: 10px 12px;
  padding: 12px; text-align: start; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  transition: border-color .15s, transform .15s;
}
.fcard:hover { border-color: var(--accent); }
.fbadge {
  display: grid; place-items: center; width: 44px; height: 54px; padding-top: 8px;
  border: 2px solid var(--accent); border-radius: 999px 999px 8px 8px;
  font: 700 1.25rem/1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums;
}
.fcard.done .fbadge { background: var(--accent); color: var(--on-accent); }
.ftxt { display: flex; flex-direction: column; min-width: 0; line-height: 1.45; }
.ft { font-weight: 600; }
.fs { color: var(--muted); font-size: .82rem; }
.fbar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.fbar i { display: block; height: 100%; background: var(--accent); }

.foot { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; color: var(--muted); font-size: .86rem; }

/* ---------- form view ---------- */
.back {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px 8px 14px; margin-inline-start: -10px;
  background: none; border: 0; border-radius: 10px; color: var(--accent); font-weight: 600;
}
.back:hover { background: var(--surface); }
.fhead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 6px 16px; margin: 6px 0 14px; }
.fhead h1 { margin: 0; font: 700 clamp(1.7rem, 6vw, 2.3rem)/1.2 var(--f-display); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 3px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: .88rem; font-variant-numeric: tabular-nums; }
.chip.ok { color: var(--ok); border-color: var(--ok); }
.chip.bad { color: var(--bad); border-color: var(--bad); }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-bottom: 22px; }
.meter i { display: block; height: 100%; background: var(--accent); }

.hint { margin: 0 0 14px; color: var(--muted); font-size: .92rem; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.tile {
  position: relative; display: grid; place-items: center; aspect-ratio: 5 / 6; padding: 6px 0 12px; min-width: 0;
  background: var(--surface); color: var(--ink);
  border: 2px solid var(--accent); border-radius: 999px 999px 10px 10px;
  font: 700 clamp(1.15rem, 4.6vw, 1.6rem)/1 var(--f-display); font-variant-numeric: tabular-nums;
  transition: transform .15s, background .15s;
}
.tile:hover { transform: translateY(-3px); background: var(--bg); }
.tile::after { position: absolute; bottom: 5px; font: 700 .8rem/1 var(--f-body); }
.tile.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.tile.ok::after { content: '✓'; }
.tile.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.tile.bad::after { content: '✕'; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 16px 0 0; color: var(--muted); font-size: .86rem; }
.legend span::before { content: ''; display: inline-block; width: 11px; height: 13px; margin-inline-end: 7px; vertical-align: -2px; border: 2px solid var(--accent); border-radius: 99px 99px 3px 3px; }
.legend .l-ok::before { background: var(--ok-bg); border-color: var(--ok); }
.legend .l-bad::before { background: var(--bad-bg); border-color: var(--bad); }

.result { margin: 0 0 22px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.result .score { display: flex; align-items: baseline; gap: 8px; }
.result .score b { font: 700 2.6rem/1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.result .score span { color: var(--muted); }
.result p { margin: 6px 0 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }

.btn {
  padding: 9px 18px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 600;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.warn { border-color: var(--bad); color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.link { border-color: transparent; background: none; color: var(--accent); padding-inline: 8px; }

/* ---------- question sheet ---------- */
.ov {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center;
  padding-inline: env(safe-area-inset-left, 0px) env(safe-area-inset-right, 0px);
  background: var(--scrim);
  animation: fade .18s ease-out;
}
.sheet {
  width: min(100%, 640px); max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain;
  padding: 16px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); color: var(--ink);
  border-radius: 24px 24px 0 0;
  animation: rise .24s cubic-bezier(.2, .8, .3, 1);
}
.ov[hidden] { display: none; }
.sheet:focus { outline: none; }
@media (min-width: 720px) {
  .ov { align-items: center; padding-block: 24px; }
  .sheet { border-radius: 24px; padding-bottom: 22px; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(28px); opacity: .4; } }
@media (prefers-reduced-motion: reduce) {
  .ov, .sheet { animation: none; }
  .tile, .fcard { transition: none; }
  .tile:hover { transform: none; }
}

.qtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.qnum { display: flex; align-items: center; gap: 12px; }
.qnum .fbadge { width: 40px; height: 48px; font-size: 1.15rem; }
.qnum small { display: block; color: var(--muted); font-size: .82rem; line-height: 1.3; }
.qnum strong { font: 700 1.05rem/1.3 var(--f-display); }
.x { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--bg); font-size: 1.3rem; line-height: 1; }
.x:hover { background: var(--line); }

.qtext { margin: 0 0 18px; font: 500 1.12rem/2 var(--f-body); text-wrap: pretty; }
.qw { display: inline-block; margin-inline: .1em; padding: 0 .4em; font: 400 1.65rem/1.9 var(--f-quran); color: var(--accent); background: var(--bg); border-radius: 10px; }
.qm { font-weight: 600; color: var(--accent); }

.opts { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; text-align: start;
  background: var(--bg); border: 2px solid var(--line); border-radius: 14px; line-height: 1.6;
}
.opt:not([disabled]):hover { border-color: var(--accent); }
.opt .lt {
  flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid var(--muted); color: var(--muted); font: 700 1rem/1 var(--f-display);
}
.opt .ot { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .ow { font: 400 1.5rem/1.8 var(--f-quran); }

(function () {
  if (window.claude) return;
  var BASE = window.NTFY_BASE || 'https://ntfy.sh';
  var TOPIC = window.NTFY_TOPIC || 'jawahir-bayan-k7x2q9m4';
  var ME;
  try { ME = sessionStorage.getItem('jw-peer'); if (!ME) { ME = 'p' + Math.random().toString(36).slice(2, 10); sessionStorage.setItem('jw-peer', ME); } }
  catch (e) { ME = 'p' + Math.random().toString(36).slice(2, 10); }
  var others = {}, myP = {}, round = { n: 0, open: false }, seen = {}, lastT = 0, cfgLast = null, cfgVer = 0, cfgDel = 0;
  var roomH = [], roundH = [], cfgH = [], dirtyRoom = false, dirtyRound = false, timer = null, pend = null, pendT = null;
  function tick() { var t = Date.now(); if (t <= lastT) t = lastT + 0.001; lastT = t; return t; }

        Object.keys(ans).forEach(function (k) { var p = k.split('-'); if (db && canW) db.doc('answers/' + docId(+p[0], +p[1])).delete().catch(function () { syncFail = true; }); });
        ans = {}; saveLocal(); armed = null; results(true);
      } else { armed = 'all'; results(true); setTimeout(function () { if (armed === 'all') { armed = null; if (view === 'results') results(true); } }, 4000); }
      return;
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target, p = t.dataset && t.dataset.cfg;
    if (t.id === 'qf' && unlocked) { edF = +t.value; edQ = null; edErr = ''; edDraft = null; settings(true); return; }
    if (!p || !unlocked) return;
    var v;
    if (t.type === 'checkbox') v = t.checked;
    else if (t.type === 'number') v = Math.max(+t.min || 0, Math.min(+t.max || 9999, Math.round(+t.value || 0)));
    else if (t.type === 'radio') { if (!t.checked) return; v = t.value; }
    else v = t.value.trim();
    if (typeof v === 'string' && !v && (p === 'title' || p.indexOf('teams.') === 0)) { settings(true); return; }
    setPath(p, v);
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'gate') return;
    e.preventDefault();
    var v = document.getElementById('pin').value;
    if (v === (cfg.pin || PIN)) { unlocked = true; gateErr = false; results(); } else { gateErr = true; results(true); }
  });
  document.addEventListener('keydown', function (e) {
    if (ov.hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); closeQ(); return; }
    if (e.key === 'Tab') {
      var f = sheet.querySelectorAll('button:not([disabled])');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === sheet)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  function route() {
    var h = location.hash || '';
    var m = /^#form-(\d+)$/.exec(h);
    if (h === '#results' && role === 'l') results();
    else if (h === '#buzz') { htab = 'b'; home(); }
    else if (m) {
      var hit = vis().filter(function (f) { return f.n === +m[1]; })[0];
      if (hit) { sel = null; form(hit.id); } else home();
    } else home();
  }
  window.addEventListener('hashchange', function () { if (ov.hidden) route(); });
  applyTheme();
  route();
  initDb();
})();
</script>
